name: Crypto Alerts V5

on:
  schedule:
    # Nieuws + nieuwe Bitvavo listings: elke 15 minuten
    - cron: "*/15 * * * *"
      timezone: "Europe/Amsterdam"

    # Momentum: elke 30 minuten, bewust op :07 en :37
    # zodat deze niet tegelijk met nieuws of de vaste digest start.
    - cron: "7,37 * * * *"
      timezone: "Europe/Amsterdam"

    # Volledige Top 5: 08:15 / 12:15 / 16:15 / 20:15 NL tijd
    - cron: "15 8,12,16,20 * * *"
      timezone: "Europe/Amsterdam"

  workflow_dispatch:
    inputs:
      mode:
        description: "Welke scanner wil je handmatig testen?"
        required: true
        default: "news"
        type: choice
        options:
          - news
          - momentum
          - full

permissions:
  contents: write

concurrency:
  group: crypto-alert-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run crypto scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          MODE="${{ inputs.mode }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$MODE" == "news" ]]; then
              NEWS_MODE=true FAST_MODE=false FORCE_DIGEST=false python alert_scanner.py
            elif [[ "$MODE" == "momentum" ]]; then
              NEWS_MODE=false FAST_MODE=true FORCE_DIGEST=false python alert_scanner.py
            else
              NEWS_MODE=false FAST_MODE=false FORCE_DIGEST=true python alert_scanner.py
            fi
          elif [[ "$SCHEDULE" == "*/15 * * * *" ]]; then
            NEWS_MODE=true FAST_MODE=false FORCE_DIGEST=false python alert_scanner.py
          elif [[ "$SCHEDULE" == "7,37 * * * *" ]]; then
            NEWS_MODE=false FAST_MODE=true FORCE_DIGEST=false python alert_scanner.py
          else
            NEWS_MODE=false FAST_MODE=false FORCE_DIGEST=true python alert_scanner.py
          fi

      - name: Save scanner state
        run: |
          if [ -f alert_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add alert_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update crypto scanner state"
              git pull --rebase origin main
              git push origin main
            fi
          fi
