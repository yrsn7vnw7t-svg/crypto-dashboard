name: Crypto Alerts V3

on:
  schedule:
    # Volledige Top 5 scan:
    # 08:15 / 12:15 / 16:15 / 20:15 Nederlandse tijd
    - cron: "15 8,12,16,20 * * *"
      timezone: "Europe/Amsterdam"

    # Lichte Fast Mover scan:
    # iedere 15 minuten, 24/7
    - cron: "*/15 * * * *"
      timezone: "Europe/Amsterdam"

  workflow_dispatch:
    inputs:
      mode:
        description: "Welke scanner wil je handmatig testen?"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - full

permissions:
  contents: write

concurrency:
  group: crypto-alert-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run crypto scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          FAST_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast') || (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') }}

          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}

        run: python alert_scanner.py

      - name: Save scanner state
        run: |
          if [ -f alert_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add alert_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update crypto scanner state"
              git pull --rebase origin main
              git push origin main
            fi
          fi
