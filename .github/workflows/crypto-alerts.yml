name: Crypto Alerts V4

on:
  schedule:
    # Nieuwsmonitor - iedere 15 minuten
    - cron: "0,15,30,45 * * * *"
      timezone: "Europe/Amsterdam"

    # Momentum scanner - iedere 30 minuten
    - cron: "5,35 * * * *"
      timezone: "Europe/Amsterdam"

    # Volledige Top 5 scan
    - cron: "15 8,12,16,20 * * *"
      timezone: "Europe/Amsterdam"

  workflow_dispatch:
    inputs:
      mode:
        description: "Welke scanner wil je handmatig testen?"
        required: true
        default: "news"
        type: choice
        options:
          - news
          - fast
          - full

permissions:
  contents: write

concurrency:
  group: crypto-alert-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run crypto scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            if [[ "${{ inputs.mode }}" == "news" ]]; then
              NEWS_MODE=true FAST_MODE=false FORCE_DIGEST=false python alert_scanner.py

            elif [[ "${{ inputs.mode }}" == "fast" ]]; then
              NEWS_MODE=false FAST_MODE=true FORCE_DIGEST=false python alert_scanner.py

            elif [[ "${{ inputs.mode }}" == "full" ]]; then
              NEWS_MODE=false FAST_MODE=false FORCE_DIGEST=true python alert_scanner.py
            fi

          elif [[ "${{ github.event.schedule }}" == "0,15,30,45 * * * *" ]]; then
            NEWS_MODE=true FAST_MODE=false FORCE_DIGEST=false python alert_scanner.py

          elif [[ "${{ github.event.schedule }}" == "5,35 * * * *" ]]; then
            NEWS_MODE=false FAST_MODE=true FORCE_DIGEST=false python alert_scanner.py

          elif [[ "${{ github.event.schedule }}" == "15 8,12,16,20 * * *" ]]; then
            # Eerst eventuele nieuwe listing / momentum oppikken
            NEWS_MODE=false FAST_MODE=true FORCE_DIGEST=false python alert_scanner.py

            # Daarna volledige Top 5 digest
            NEWS_MODE=false FAST_MODE=false FORCE_DIGEST=true python alert_scanner.py
          fi

      - name: Save scanner state
        run: |
          if [ -f alert_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add alert_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update crypto scanner state"
              git pull --rebase origin main
              git push origin main
            fi
          fi
